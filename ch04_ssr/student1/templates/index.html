<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클릭 카운터</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>클릭 시 숫자 증가</h2>

    <h1 class="display-1" id="num">0</h1>

    <form>
        <input class="btn btn-primary" id="increase" type="button" value="수 증가">
        <input type="hidden" name="num" id="numInput" value="0">
        <input class="btn btn-success" type="button" id="submit" value="전송">
    </form>

    <h3 class="mt-5">최근 기록</h3>

    {% if counts %}
    <table class="table">
        <thead>
        <tr>
            <th>번호</th>
            <th>클릭 수</th>
            <th>저장 시각</th>
        </tr>
        </thead>
        <tbody>
        {% for row in counts %}
        <tr>
            <td>{{ row.id }}</td>
            <td>{{ row.num }}</td>
            <td>{{ row.created_at }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="text-muted">아직 저장된 기록이 없음</p>
    {% endif %}
</div>

<script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
