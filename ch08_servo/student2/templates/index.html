<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서보모터 제어</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<div class="container text-center mt-5" style="max-width: 400px;">
		<h2>서브모터 제어</h2>
		<input class="form-control mb-2" id="angle" type="number" placeholder="0 ~ 180">
		<input class="btn btn-primary" id="setAngle" type="button" value="움직이기">
		<p class="mt-3" id="message"></p>
	</div>
	<div class="mt-2">
  		<button class="btn btn-primary" onclick="setAnglePreset(0)">0°</button>
  		<button class="btn btn-primary" onclick="setAnglePreset(90)">90°</button>
  		<button class="btn btn-primary" onclick="setAnglePreset(180)">180°</button>
	</div>
	<script src="/static/index.js"></script>
</body>
</html>
