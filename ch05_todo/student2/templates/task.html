<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>투두 리스트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 600px;">
    <h1 class="mb-4">투두 리스트</h1>

    <form action="/add" method="post" class="d-flex gap-2 mb-4">
        <input type="text" name="content" class="form-control" placeholder="할 일을 입력" required>
        <button type="submit" class="btn btn-primary">추가</button>
    </form>

    {% if tasks %}
    <ul class="list-group">
        {% for task in tasks %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="{% if task.is_done %}done{% endif %}">{{ task.content }}</span>
            <div class="d-flex gap-1">
                <form action="/complete/{{ task.id }}" method="post">
                    <button type="submit" class="btn btn-success btn-sm">
                        {% if task.is_done %}취소{% else %}완료{% endif %}
                    </button>
                </form>
                <form action="/delete/{{ task.id }}" method="post">
                    <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                </form>
            </div>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="text-muted">등록된 할 일이 없음</p>
    {% endif %}
</div>
</body>
</html>
